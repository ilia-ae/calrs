{#- ilia fork: an unpaid booking cannot be confirmed or moved, only waived or declined (docs/ton.md). -#}
{% if pay.waivable %}
<a href="{{ pay.waive_url }}" class="btn btn-sm btn-auto">{{ t("ton-dash-waive") }}</a>
{% endif %}
<form method="post" action="/dashboard/bookings/{{ b.id }}/cancel" style="margin: 0;">
  <button type="submit" class="btn btn-secondary btn-sm btn-auto">{{ t("bookings-decline") }}</button>
</form>
